<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PDF Tools - Mobile & Desktop Workspace</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#005BAC">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/heic2any.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.5);
            --text-main: #1A1A1D;
            --text-muted: #555555;
            --bca-blue: #005BAC;
            --bca-blue-hover: #004A8D;
            --shadow: 0 10px 30px rgba(0, 91, 172, 0.1);
            --input-bg: rgba(255, 255, 255, 0.9);
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            --glass-bg: rgba(20, 20, 25, 0.65);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #FFFFFF;
            --text-muted: #AAAAAA;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            --input-bg: rgba(0, 0, 0, 0.5);
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; transition: background 0.3s, color 0.3s, border-color 0.3s; }

        body { 
            margin: 0; display: flex; height: 100vh; background: var(--bg-gradient); 
            color: var(--text-main); overflow: hidden;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        .glass-panel { background: var(--glass-bg); backdrop-filter: blur(16px); border: 1px solid var(--glass-border); box-shadow: var(--shadow); border-radius: 20px; }

        /* SIDEBAR */
        .sidebar { width: 280px; margin: 1rem; display: flex; flex-direction: column; padding: 1.5rem 0; overflow-y: auto; z-index: 1000; }
        .logo { font-size: 1.5rem; font-weight: 800; padding: 0 1.5rem 1rem; border-bottom: 1px solid var(--glass-border); margin-bottom: 1rem; letter-spacing: 1px; display: flex; justify-content: space-between; align-items: center; }
        .logo span { color: var(--bca-blue); }
        .close-sidebar { display: none; background: none; border: none; font-size: 1.5rem; color: var(--text-main); cursor: pointer; }
        
        .menu-label { font-size: 0.75rem; color: var(--text-muted); padding: 0 1.5rem; margin-top: 1rem; margin-bottom: 0.5rem; text-transform: uppercase; font-weight: bold; }
        .menu-item { padding: 0.8rem 1.5rem; cursor: pointer; display: flex; align-items: center; gap: 12px; text-decoration: none; font-size: 0.95rem; margin: 0.2rem 1rem; border-radius: 12px; min-height: 48px; }
        .menu-item:hover, .menu-item.active { background-color: var(--bca-blue); color: white; box-shadow: 0 4px 15px rgba(0, 91, 172, 0.3); }
        
        .footer-credits { margin-top: auto; text-align: center; padding: 1rem; font-size: 0.85rem; color: var(--text-muted); font-weight: 600; border-top: 1px solid var(--glass-border); }
        .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 999; backdrop-filter: blur(4px); }

        /* MAIN CONTENT */
        .main-content { flex: 1; margin: 1rem 1rem 1rem 0; padding: 2rem; display: flex; flex-direction: column; overflow-y: auto; position: relative; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; gap: 10px; flex-wrap: wrap; }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .hamburger { display: none; background: none; border: none; font-size: 1.8rem; color: var(--text-main); cursor: pointer; padding: 0; }
        .theme-toggle { background: var(--input-bg); border: 1px solid var(--glass-border); color: var(--text-main); padding: 10px 16px; border-radius: 20px; cursor: pointer; font-weight: 600; min-height: 44px; }

        /* WORKSPACE & DROPZONE */
        .workspace { display: none; flex-direction: column; align-items: center; justify-content: center; height: 100%; flex: 1; }
        .workspace.active { display: flex; }
        .drop-zone { width: 100%; max-width: 600px; padding: 3rem 1.5rem; text-align: center; border: 2px dashed var(--bca-blue); border-radius: 20px; background: rgba(0, 91, 172, 0.05); cursor: pointer; transition: 0.3s; }
        .drop-zone:hover, .drop-zone.dragover { background: rgba(0, 91, 172, 0.15); transform: translateY(-5px); }

        /* PREVIEW PANEL ADJUSTABLE */
        .preview-panel { display: none; width: 100%; gap: 1.5rem; animation: fadeIn 0.4s ease; height: 100%; flex-direction: row; }
        .preview-panel.active { display: flex; }
        
        .preview-frame { 
            flex: 1.2; 
            border-radius: 12px; 
            border: 1px solid var(--glass-border); 
            background: #e9ecef; /* Warna netral pembungkus PDF */
            display: flex; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
            min-height: 350px; 
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }
        
        /* Iframe disesuaikan agar auto-fit */
        .preview-frame iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            position: absolute; 
            top: 0; left: 0; right: 0; bottom: 0; 
            background: white; 
        }

        /* Tombol Fullscreen Modern */
        .fullscreen-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 91, 172, 0.8);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            cursor: pointer;
            z-index: 20;
            backdrop-filter: blur(4px);
            font-weight: bold;
            font-size: 1rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: 0.2s;
        }
        .fullscreen-btn:hover { background: var(--bca-blue); transform: scale(1.05); }

        .settings-panel { flex: 1; display: flex; flex-direction: column; gap: 1rem; overflow-y: auto; padding-right: 5px; }
        input[type="text"], input[type="password"], select { width: 100%; padding: 14px; background: var(--input-bg); border: 1px solid var(--glass-border); color: var(--text-main); border-radius: 10px; font-size: 1rem; min-height: 48px; }
        input[type="range"] { width: 100%; margin: 15px 0; }
        
        .range-container { display: flex; align-items: center; gap: 15px; }
        .range-container span { font-weight: bold; min-width: 45px; text-align: right; }

        .btn-group { margin-top: auto; display: flex; gap: 10px; flex-wrap: wrap; }
        .btn { background-color: var(--bca-blue); color: white; border: none; padding: 14px 20px; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 1rem; box-shadow: 0 4px 15px rgba(0, 91, 172, 0.3); flex: 2; min-height: 48px; min-width: 120px; text-align: center; }
        .btn:hover { background-color: var(--bca-blue-hover); transform: translateY(-2px); }
        .btn.secondary { background-color: transparent; border: 1px solid var(--glass-border); color: var(--text-main); box-shadow: none; flex: 1; }

        /* RESPONSIVE LAYOUT UNTUK HP */
        @media (max-width: 900px) {
            body { flex-direction: column; overflow: hidden; }
            .sidebar { position: fixed; top: 0; left: -300px; height: 100vh; margin: 0; border-radius: 0; transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1); width: 280px; }
            .sidebar.show { left: 0; box-shadow: 5px 0 30px rgba(0,0,0,0.5); }
            .close-sidebar, .hamburger { display: block; }
            .main-content { margin: 0; border-radius: 0; padding: 1.5rem 1rem; width: 100%; height: 100vh; }
            
            /* Pratinjau mengambil proporsi ideal di HP */
            .preview-panel { flex-direction: column; overflow-y: auto; gap: 1.2rem; display: none; }
            .preview-panel.active { display: flex; }
            
            .preview-frame { 
                flex: none; 
                height: 50vh; /* Memakan setengah tinggi layar HP */
                min-height: 350px; 
                width: 100%; 
            }
            .settings-panel { flex: none; overflow-y: visible; padding-bottom: 3rem; }
            .drop-zone h3 { font-size: 1.2rem; }
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

    <!-- SIDEBAR -->
    <aside class="sidebar glass-panel" id="sidebar">
        <div class="logo">
            <div>PDF<span>TOOLS</span></div>
            <button class="close-sidebar" onclick="toggleSidebar()">✖</button>
        </div>
        <div class="menu-label">Proteksi & Edit</div>
        <div class="menu-item active" onclick="nav('watermark')">🛡️ Watermark PDF</div>
        <div class="menu-item" onclick="nav('lock')">🔒 Protect PDF</div>
        <div class="menu-item" onclick="nav('unlock')">🔓 Unlock PDF</div>
        <div class="menu-item" onclick="nav('removepages')">✂️ Hapus Halaman</div>
        <div class="menu-item" onclick="nav('merge')">📑 Gabung PDF</div>
        
        <div class="menu-label">Konversi & Optimasi</div>
        <div class="menu-item" onclick="nav('compress')">🗜️ Compress PDF</div>
        <div class="menu-item" onclick="nav('pdf2img')">🖼️ PDF to Image</div>
        <div class="menu-item" onclick="nav('img2pdf')">📄 Image to PDF</div>
        <div class="menu-item" onclick="nav('heic')">📱 HEIC Converter</div>

        <div class="footer-credits">Created by Ridwan</div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content glass-panel">
        <div class="top-bar">
            <div class="header-left">
                <button class="hamburger" onclick="toggleSidebar()">☰</button>
                <h2 id="page-title" style="margin:0; font-size: 1.3rem;">Watermark PDF</h2>
            </div>
            <button class="theme-toggle" onclick="toggleTheme()">🌓 Tema</button>
        </div>

        <div id="upload-section" class="workspace active">
            <div class="drop-zone" id="drop-zone">
                <div style="font-size: 3.5rem; margin-bottom: 0.5rem;">☁️</div>
                <h3>Sentuh atau Tarik Berkas</h3>
                <p style="color: var(--text-muted); font-size: 0.9rem;">Mendukung PDF & Semua Gambar</p>
            </div>
            <input type="file" id="file-input" style="display: none;">
        </div>

        <div id="preview-section" class="preview-panel">
            <div class="preview-frame" id="preview-container">
                <button class="fullscreen-btn" onclick="openFullscreen()" title="Lihat Layar Penuh">⛶ Perbesar</button>
                <iframe id="pdf-preview"></iframe>
                <p id="preview-loading" style="display: none; position: absolute; background: rgba(0,0,0,0.7); color: white; padding: 10px 20px; border-radius: 20px; font-weight: bold; z-index: 10;">Memuat...</p>
            </div>
            <div class="settings-panel">
                <h3 style="margin-top: 0;">Pengaturan</h3>
                <label style="font-weight: 600; font-size: 0.9rem;">Nama File Baru:</label>
                <input type="text" id="rename-input" placeholder="NamaFileBaru">
                <div id="dynamic-options"></div>
                <div class="btn-group">
                    <button class="btn secondary" onclick="resetWorkspace()">Batal</button>
                    <button class="btn" onclick="processFile()" id="process-btn">Download</button>
                </div>
                <div id="status-msg" style="text-align: center; font-weight: bold; margin-top: 15px;"></div>
            </div>
        </div>
    </main>

    <script>
        if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(err => console.error('PWA gagal:', err)); }); }
    </script>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        const { PDFDocument, rgb, degrees } = PDFLib;

        let currentTool = 'watermark';
        let currentFile = null;
        let currentFilesList = [];
        let previewBlobUrl = null; 

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.toggle('show');
            overlay.style.display = sidebar.classList.contains('show') ? 'block' : 'none';
        }

        // Fitur Layar Penuh (Fullscreen) untuk Frame Preview
        function openFullscreen() {
            const elem = document.getElementById("pdf-preview");
            if (elem.requestFullscreen) { elem.requestFullscreen(); }
            else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(); } // Safari
            else if (elem.msRequestFullscreen) { elem.msRequestFullscreen(); } // IE11
        }

        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', (e) => { e.preventDefault(); dropZone.classList.remove('dragover'); });
        dropZone.addEventListener('drop', (e) => { e.preventDefault(); dropZone.classList.remove('dragover'); if (e.dataTransfer.files.length) { fileInput.files = e.dataTransfer.files; handleFileSelect({ target: fileInput }); } });
        fileInput.addEventListener('change', handleFileSelect);

        function toggleTheme() {
            const body = document.body;
            body.setAttribute('data-theme', body.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
            const metaThemeColor = document.querySelector("meta[name=theme-color]");
            if(body.getAttribute('data-theme') === 'dark') metaThemeColor.setAttribute("content", "#0f2027");
            else metaThemeColor.setAttribute("content", "#005BAC");
        }

        function nav(tool) {
            currentTool = tool;
            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');
            if(window.innerWidth <= 900) { toggleSidebar(); }
            resetWorkspace();

            const titles = { 'watermark': 'Watermark PDF', 'lock': 'Protect PDF', 'unlock': 'Unlock PDF', 'removepages': 'Hapus Halaman', 'merge': 'Gabung PDF', 'compress': 'Compress PDF', 'pdf2img': 'PDF ke Gambar', 'img2pdf': 'Gambar ke PDF', 'heic': 'HEIC Converter' };
            document.getElementById('page-title').innerText = titles[tool];
            
            fileInput.multiple = (tool === 'merge' || tool === 'img2pdf');
            if (tool === 'heic') fileInput.accept = ".heic";
            else if (tool === 'img2pdf') fileInput.accept = "image/*";
            else fileInput.accept = "application/pdf";
        }

        function resetWorkspace() {
            document.getElementById('upload-section').classList.add('active');
            document.getElementById('preview-section').classList.remove('active');
            fileInput.value = "";
            document.getElementById('status-msg').innerText = "";
            if (previewBlobUrl) URL.revokeObjectURL(previewBlobUrl);
            currentFile = null;
            currentFilesList = [];
        }

        function handleFileSelect(event) {
            const files = event.target.files;
            if (files.length === 0) return;

            if (currentTool === 'merge' || currentTool === 'img2pdf') { currentFilesList = Array.from(files); currentFile = files[0]; } 
            else { currentFile = files[0]; }

            document.getElementById('upload-section').classList.remove('active');
            document.getElementById('preview-section').classList.add('active');
            
            const iframe = document.getElementById('pdf-preview');
            const fsBtn = document.querySelector('.fullscreen-btn');
            
            if (currentTool === 'heic' || currentTool === 'img2pdf') {
                iframe.style.display = 'none'; fsBtn.style.display = 'none';
                iframe.src = '';
            } else {
                iframe.style.display = 'block'; fsBtn.style.display = 'block';
                previewBlobUrl = URL.createObjectURL(currentFile);
                // Parameter rahasia #view=FitH memaksa PDF pas ke lebar layar tanpa terpotong
                iframe.src = previewBlobUrl + "#toolbar=0&view=FitH";
            }

            const originalName = currentFile.name.substring(0, currentFile.name.lastIndexOf('.'));
            document.getElementById('rename-input').value = originalName + "_Edited";

            buildDynamicOptions();
            if(currentTool === 'watermark') updateLivePreview();
        }

        function buildDynamicOptions() {
            const container = document.getElementById('dynamic-options');
            container.innerHTML = ''; 
            if (currentTool === 'watermark') {
                container.innerHTML = `<label style="margin-top:1rem; display:block; font-weight:600; font-size: 0.9rem;">Teks Watermark:</label><input type="text" id="opt-wm-text" value="CONFIDENTIAL" oninput="updateLivePreview()"><label style="margin-top:1rem; display:block; font-weight:600; font-size: 0.9rem;">Transparansi (Opacity):</label><div class="range-container"><input type="range" id="opt-wm-opacity" min="0.05" max="1" step="0.05" value="0.15" oninput="updateLivePreview()"><span id="opacity-val">15%</span></div>`;
            } else if (currentTool === 'compress') {
                container.innerHTML = `<label style="margin-top:1rem; display:block; font-weight:600; font-size: 0.9rem;">Level Kompresi:</label><select id="opt-compress-level"><option value="normal">Normal (Aman & Utuh)</option><option value="high">Ekstrem (Ubah Gambar Kualitas Rendah)</option></select>`;
            } else if (currentTool === 'removepages') {
                container.innerHTML = `<label style="margin-top:1rem; display:block; font-weight:600; font-size: 0.9rem;">Halaman yang DISIMPAN (Contoh: 1,3,4-5):</label><input type="text" id="opt-pages" placeholder="Ketik nomor halaman">`;
            } else if (currentTool === 'lock') {
                container.innerHTML = `<label style="margin-top:1rem; display:block; font-weight:600; font-size: 0.9rem;">Masukkan Password Baru:</label><input type="password" id="opt-lock-pass" placeholder="Buat Password">`;
            } else if (currentTool === 'unlock') {
                container.innerHTML = `<label style="margin-top:1rem; display:block; font-weight:600; font-size: 0.9rem;">Password PDF Saat Ini:</label><input type="password" id="opt-unlock-pass" placeholder="Password PDF">`;
            } else if (currentTool === 'heic') {
                container.innerHTML = `<label style="margin-top:1rem; display:block; font-weight:600; font-size: 0.9rem;">Pilih Format Output:</label><select id="opt-heic-format"><option value="jpg">Gambar (.JPG)</option><option value="pdf">Dokumen (.PDF)</option></select>`;
            }
        }

        let previewTimeout;
        async function updateLivePreview() {
            if (currentTool !== 'watermark' || !currentFile) return;
            const text = document.getElementById('opt-wm-text').value;
            const opacityVal = document.getElementById('opt-wm-opacity').value;
            document.getElementById('opacity-val').innerText = Math.round(opacityVal * 100) + '%';
            document.getElementById('preview-loading').style.display = 'block';

            clearTimeout(previewTimeout);
            previewTimeout = setTimeout(async () => {
                try {
                    const pdfDoc = await PDFDocument.load(await currentFile.arrayBuffer());
                    const pages = pdfDoc.getPages();
                    pages.forEach(page => {
                        const { width, height } = page.getSize();
                        for (let x = -width; x < width * 2; x += 250) {
                            for (let y = -height; y < height * 2; y += 250) {
                                page.drawText(text, { x: x, y: y, size: 24, color: rgb(0.5, 0.5, 0.5), opacity: parseFloat(opacityVal), rotate: degrees(45) });
                            }
                        }
                    });
                    if (previewBlobUrl) URL.revokeObjectURL(previewBlobUrl);
                    previewBlobUrl = URL.createObjectURL(new Blob([await pdfDoc.save()], { type: 'application/pdf' }));
                    document.getElementById('pdf-preview').src = previewBlobUrl + "#toolbar=0&view=FitH";
                } catch (e) {}
                document.getElementById('preview-loading').style.display = 'none';
            }, 800); 
        }

        function downloadBlob(blob, ext, suffix = "") {
            let filename = document.getElementById('rename-input').value.trim();
            if (!filename) filename = "PDFTools";
            if (suffix) filename += suffix; 
            if (!filename.toLowerCase().endsWith(ext)) filename += ext;
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = filename;
            a.click(); URL.revokeObjectURL(url);
        }

        function convertAnyImageToJpgBuffer(file) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width; canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    canvas.toBlob(async (blob) => resolve(await blob.arrayBuffer()), 'image/jpeg', 0.9);
                };
                img.onerror = reject; img.src = URL.createObjectURL(file);
            });
        }

        async function processFile() {
            const status = document.getElementById('status-msg');
            status.innerText = "Memproses..."; status.style.color = "var(--text-main)";
            document.getElementById('process-btn').disabled = true; document.getElementById('process-btn').innerText = "Tunggu...";

            try {
                await new Promise(resolve => setTimeout(resolve, 100)); 
                if (currentTool === 'watermark') await runWatermark();
                else if (currentTool === 'removepages') await runRemovePages();
                else if (currentTool === 'merge') await runMerge();
                else if (currentTool === 'compress') await runCompress();
                else if (currentTool === 'pdf2img') await runPdfToImg();
                else if (currentTool === 'img2pdf') await runImgToPdf();
                else if (currentTool === 'unlock') await runUnlock();
                else if (currentTool === 'lock') await runLock();
                else if (currentTool === 'heic') await runHeic();
                status.innerText = "✓ Berhasil diunduh!"; status.style.color = "#4CAF50";
            } catch (e) { status.innerText = "⚠ Gagal: " + e.message; status.style.color = "#D32F2F"; }
            
            document.getElementById('process-btn').innerText = "Download"; document.getElementById('process-btn').disabled = false;
        }
        
        async function runWatermark() {
            const text = document.getElementById('opt-wm-text').value;
            const opacity = parseFloat(document.getElementById('opt-wm-opacity').value);
            const pdfDoc = await PDFDocument.load(await currentFile.arrayBuffer());
            pdfDoc.getPages().forEach(page => {
                const { width, height } = page.getSize();
                for (let x = -width; x < width * 2; x += 250) { for (let y = -height; y < height * 2; y += 250) { page.drawText(text, { x: x, y: y, size: 24, color: rgb(0.5, 0.5, 0.5), opacity: opacity, rotate: degrees(45) }); } }
            });
            downloadBlob(new Blob([await pdfDoc.save()], { type: 'application/pdf' }), '.pdf');
        }

        async function runCompress() {
            const level = document.getElementById('opt-compress-level').value;
            if (level === 'normal') { downloadBlob(new Blob([await (await PDFDocument.load(await currentFile.arrayBuffer())).save({ useObjectStreams: false })], { type: 'application/pdf' }), '.pdf'); } 
            else {
                const pdf = await pdfjsLib.getDocument({data: await currentFile.arrayBuffer()}).promise;
                const newPdf = await PDFDocument.create();
                for(let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const viewport = page.getViewport({ scale: 1.2 });
                    const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
                    canvas.width = viewport.width; canvas.height = viewport.height;
                    await page.render({ canvasContext: ctx, viewport: viewport }).promise;
                    const imgBuffer = await new Promise(res => canvas.toBlob(async b => res(await b.arrayBuffer()), 'image/jpeg', 0.6));
                    const image = await newPdf.embedJpg(imgBuffer);
                    const newPage = newPdf.addPage([image.width, image.height]);
                    newPage.drawImage(image, { x: 0, y: 0, width: image.width, height: image.height });
                }
                downloadBlob(new Blob([await newPdf.save()], { type: 'application/pdf' }), '.pdf');
            }
        }

        async function runPdfToImg() {
            const pdf = await pdfjsLib.getDocument({data: await currentFile.arrayBuffer()}).promise;
            for(let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const viewport = page.getViewport({ scale: 2.0 }); 
                const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
                canvas.width = viewport.width; canvas.height = viewport.height;
                await page.render({ canvasContext: ctx, viewport: viewport }).promise;
                canvas.toBlob(blob => { downloadBlob(blob, '.jpg', `_Halaman_${i}`); }, 'image/jpeg', 0.9);
                await new Promise(r => setTimeout(r, 400)); 
            }
        }

        async function runImgToPdf() {
            const pdfDoc = await PDFDocument.create();
            for (let file of currentFilesList) {
                const image = await pdfDoc.embedJpg(await convertAnyImageToJpgBuffer(file));
                const page = pdfDoc.addPage([image.width, image.height]);
                page.drawImage(image, { x: 0, y: 0, width: image.width, height: image.height });
            }
            downloadBlob(new Blob([await pdfDoc.save()], { type: 'application/pdf' }), '.pdf');
        }

        async function runRemovePages() {
            const input = document.getElementById('opt-pages').value;
            const pdfDoc = await PDFDocument.load(await currentFile.arrayBuffer());
            let pagesToKeep = new Set();
            input.split(',').forEach(part => {
                let bounds = part.split('-');
                if (bounds.length === 2) { for (let i = parseInt(bounds[0]); i <= parseInt(bounds[1]); i++) { if (i > 0 && i <= pdfDoc.getPageCount()) pagesToKeep.add(i - 1); } } 
                else { let val = parseInt(part); if (val > 0 && val <= pdfDoc.getPageCount()) pagesToKeep.add(val - 1); }
            });
            const newPdf = await PDFDocument.create();
            (await newPdf.copyPages(pdfDoc, Array.from(pagesToKeep).sort((a,b) => a-b))).forEach(page => newPdf.addPage(page));
            downloadBlob(new Blob([await newPdf.save()], { type: 'application/pdf' }), '.pdf');
        }

        async function runMerge() {
            const mergedPdf = await PDFDocument.create();
            for (let file of currentFilesList) {
                (await mergedPdf.copyPages(await PDFDocument.load(await file.arrayBuffer()), (await PDFDocument.load(await file.arrayBuffer())).getPageIndices())).forEach(page => mergedPdf.addPage(page));
            }
            downloadBlob(new Blob([await mergedPdf.save()], { type: 'application/pdf' }), '.pdf');
        }

        async function runUnlock() { downloadBlob(new Blob([await (await PDFDocument.load(await currentFile.arrayBuffer(), { password: document.getElementById('opt-unlock-pass').value })).save()], { type: 'application/pdf' }), '.pdf'); }

        async function runLock() {
            const pass = document.getElementById('opt-lock-pass').value;
            const htmlVault = `<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dokumen Terkunci</title><style>body{font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;background:#121212;color:#fff;margin:0;padding:20px;}.box{background:#1E1E1E;padding:30px;border-radius:10px;text-align:center;border:1px solid #333;width:100%;max-width:400px;}input{padding:14px;width:100%;box-sizing:border-box;margin:15px 0;border-radius:8px;border:1px solid #555;background:#111;color:#fff;}button{background:#005BAC;color:white;border:none;padding:14px 20px;border-radius:8px;cursor:pointer;font-weight:bold;width:100%;}</style></head><body><div class="box"><h2>🔒 Dokumen Terkunci</h2><p>Masukkan password untuk mendownload PDF.</p><input type="password" id="pass" placeholder="Password"><button onclick="unlock()">Buka & Download</button><p id="msg" style="color:red;"></p></div><script>const truePass="${pass}";const fileData="${btoa(new Uint8Array(await currentFile.arrayBuffer()).reduce((data, byte) => data + String.fromCharCode(byte), ''))}";const fileName="${currentFile.name}";function unlock(){if(document.getElementById('pass').value===truePass){const byteCharacters=atob(fileData);const byteNumbers=new Array(byteCharacters.length);for(let i=0;i<byteCharacters.length;i++)byteNumbers[i]=byteCharacters.charCodeAt(i);const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([new Uint8Array(byteNumbers)],{type:'application/pdf'}));link.download=fileName;link.click();document.getElementById('msg').style.color="#4CAF50";document.getElementById('msg').innerText="Berhasil! Mendownload...";}else{document.getElementById('msg').innerText="Password Salah!";}}<\/script></body></html>`;
            downloadBlob(new Blob([htmlVault], { type: 'text/html' }), '.html');
        }

        async function runHeic() {
            const format = document.getElementById('opt-heic-format').value;
            const conversionResult = await heic2any({ blob: new Blob([await currentFile.arrayBuffer()]), toType: "image/jpeg", quality: 0.8 });
            if (format === 'jpg') downloadBlob(conversionResult, '.jpg');
            else if (format === 'pdf') {
                const pdfDoc = await PDFDocument.create();
                const image = await pdfDoc.embedJpg(await conversionResult.arrayBuffer());
                const page = pdfDoc.addPage([image.width, image.height]);
                page.drawImage(image, { x: 0, y: 0, width: image.width, height: image.height });
                downloadBlob(new Blob([await pdfDoc.save()], { type: 'application/pdf' }), '.pdf');
            }
        }
    </script>
